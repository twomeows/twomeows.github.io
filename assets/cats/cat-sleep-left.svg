<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="160" height="150">
  <!-- Сонний рудий котик, згорнувся клубочком -->
  <g>
    <ellipse cx="60" cy="105" rx="66" ry="38" fill="#f6a04d"/>
    <!-- хвостик обгорнув тіло -->
    <path d="M112 118 Q136 112 128 92 Q124 82 110 86" stroke="#e0862e" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- голова лежить -->
    <circle cx="72" cy="78" r="32" fill="#f6a04d"/>
    <path d="M46 58 L42 32 L64 48 Z" fill="#f6a04d"/>
    <path d="M98 58 L102 32 L80 48 Z" fill="#f6a04d"/>
    <path d="M48 54 L45 40 L58 49 Z" fill="#ffd9ae"/>
    <path d="M96 54 L99 40 L86 49 Z" fill="#ffd9ae"/>
    <!-- заплющені очі -->
    <path d="M54 78 Q60 83 66 78" stroke="#2d3a4d" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M80 78 Q86 83 92 78" stroke="#2d3a4d" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M68 90 Q73 93 78 90" stroke="#2d3a4d" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="73" cy="87" rx="4" ry="3" fill="#e77b6a"/>
    <circle cx="50" cy="88" r="5.5" fill="#ffc48f" opacity=".8"/>
    <circle cx="96" cy="88" r="5.5" fill="#ffc48f" opacity=".8"/>
    <!-- z-z-z -->
    <g fill="#7c6bd6" font-family="Nunito, sans-serif" font-weight="900">
      <text x="108" y="52" font-size="20" opacity=".9">z
        <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="122" y="36" font-size="15" opacity=".7">z
        <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="134" y="24" font-size="11" opacity=".5">z
        <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
